name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compilar:
    name: Compilar, testar e publicar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: LinuxExplode.csproj

      - name: Restore
        run: dotnet restore

      # Os avisos CS0618/CS9193 do Silk.NET em BenchRt.cs são conhecidos:
      # compila-se sem TreatWarningsAsErrors de propósito.
      - name: Build (Release)
        run: dotnet build -c Release --no-restore -v n

      # O modo --cli sai antes de inicializar o Avalonia, por isso corre sem ecrã.
      - name: Smoke test (CLI, sem janela)
        run: |
          set -euo pipefail
          BIN=./bin/Release/net10.0/LinuxExplode
          $BIN --cli info | tee /tmp/info.txt
          grep -q 'LINUX EXPLODE' /tmp/info.txt
          $BIN --cli sensores | head -20
          $BIN --cli potencia
          $BIN --cli freq | head -10
          # dispositivos: no runner há /sys (pci/usb) e não há placas de som — a app degrada e di-lo
          # sem `| head` directo: com pipefail o SIGPIPE do head mata o processo (exit 141) e o passo falha
          $BIN --cli placa > /tmp/placa.txt && head -10 /tmp/placa.txt
          $BIN --cli usb   > /tmp/usb.txt   && head -5  /tmp/usb.txt
          $BIN --cli audio > /tmp/audio.txt && head -5  /tmp/audio.txt
          $BIN --cli placa --json | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["comando"]=="placa", d'
          $BIN --cli usb --json   | python3 -c 'import json,sys; d=json.load(sys.stdin); assert isinstance(d["dados"],list), d'
          $BIN --cli audio --json | python3 -c 'import json,sys; d=json.load(sys.stdin); assert "Nos" in d["dados"], d'
          $BIN --cli ranking > /tmp/ranking.txt
          # o $HOME do sandbox Flatpak é temporário: sem --persist o histórico e as sessões desaparecem
          grep -q -- '--persist=.local/share/linux-explode' flatpak/pt.linuxexplode.LinuxExplode.json
          $BIN --cli gravar 2 --json | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["dados"]["amostras"] == 2, d'

      - name: Testes unitários
        run: dotnet test tests/LinuxExplode.Tests/LinuxExplode.Tests.csproj -c Release --nologo

      - name: Publicar binário x64 (self-contained)
        run: >
          dotnet publish LinuxExplode.csproj -c Release -r linux-x64 --self-contained true
          -p:DebugType=None -o publish-check --nologo

      - name: Confirmar o binário publicado
        run: ./publish-check/LinuxExplode --cli info | head -3

      - uses: actions/upload-artifact@v4
        with:
          name: linux-explode-linux-x64
          path: publish-check/
          retention-days: 7

  compilar-arm64:
    name: Publicar binário ARM64 (sem correr)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Cross-publish: compila para aarch64 no anfitrião x64, sem emulação.
      - name: Publicar linux-arm64
        run: >
          dotnet publish LinuxExplode.csproj -c Release -r linux-arm64 --self-contained true
          -p:DebugType=None -o publish-arm64-check --nologo
