name: Release

# Constrói os artefactos com o próprio empacotar.sh e anexa-os ao release da tag.
# Corre em push de tag v* e, à mão, para reconstruir os assets de uma tag existente.
#
# Os dois builds correm em jobs separados de propósito: o publish arm64 falhava quando
# acontecia na mesma directoria depois do flatpak-builder, com o glob `**/*.axaml` do
# Avalonia a apanhar build-dir/.flatpak-builder (ver DefaultItemExcludes no .csproj).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag existente cujos assets devem ser reconstruídos (ex.: v0.1.0)'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  preparar:
    name: Criar o release da tag (se não existir)
    runs-on: ubuntu-latest
    steps:
      - name: Criar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "LINUX EXPLODE $TAG" --generate-notes \
              $( [ "${{ github.event_name }}" = "push" ] && echo --verify-tag )

  flatpak-x86_64:
    name: Flatpak x86_64
    needs: preparar
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # O empacotar.sh usa `flatpak run org.flatpak.Builder` e o manifesto aponta ao 25.08.
      - name: Instalar Flatpak, Builder e runtime 25.08
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder
          dbus-run-session -- bash -c '
            set -euo pipefail
            flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
            flatpak install --user -y --noninteractive flathub \
              org.flatpak.Builder \
              org.freedesktop.Platform/x86_64/25.08 \
              org.freedesktop.Sdk/x86_64/25.08
          '

      - name: Compilar bundle
        run: dbus-run-session -- ./empacotar.sh --bundle

      - name: Verificar o bundle
        run: |
          set -euo pipefail
          ls -lh linux-explode.flatpak
          test -s linux-explode.flatpak

      - name: Anexar ao release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber linux-explode.flatpak

      # O repositório OSTree do build (flatpak/repo-x86_64, archive-z2) é publicado no ramo
      # gh-pages: é o que permite ao gestor de pacotes ver e aplicar actualizações
      # (remote https://<owner>.github.io/<repo>/).
      - name: Publicar repositório Flatpak no ramo gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO=flatpak/repo-x86_64
          test -f "$REPO/summary"

          git config --global user.name  "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -rf /tmp/pages
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git worktree add --detach /tmp/pages origin/gh-pages
            ( cd /tmp/pages && git checkout -B gh-pages )
          else
            git worktree add --detach /tmp/pages
            ( cd /tmp/pages && git checkout --orphan gh-pages && git rm -rf . >/dev/null 2>&1 || true )
          fi

          # copia só o que os clientes precisam, sem apagar o que já lá está (deltas antigos)
          rm -rf "$REPO/tmp" "$REPO/state"
          rsync -a --ignore-existing "$REPO/objects" /tmp/pages/
          rsync -a "$REPO/config" "$REPO/refs" "$REPO/summary" /tmp/pages/
          [ -f "$REPO/summary.idx" ] && cp "$REPO/summary.idx" /tmp/pages/
          [ -d "$REPO/summaries" ] && rsync -a "$REPO/summaries" /tmp/pages/
          touch /tmp/pages/.nojekyll
          cp flatpak/pages/index.html /tmp/pages/index.html

          cd /tmp/pages
          git add -A
          git commit -m "repositório flatpak ${TAG}" || echo "sem alterações"
          git push origin HEAD:gh-pages

  arm64:
    name: ARM64 (Flatpak + instalador)
    needs: preparar
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # O ramo --arm64 do empacotar.sh usa build-finish/build-export/build-bundle:
      # são parte do pacote flatpak, não do org.flatpak.Builder.
      - name: Instalar flatpak (build-finish, build-export, build-bundle)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak

      # Cross-publish aarch64 no anfitrião x64, sem emulação.
      - name: Compilar tar.gz e bundle aarch64
        run: ./empacotar.sh --arm64

      - name: Verificar os artefactos
        run: |
          set -euo pipefail
          ls -lh linux-explode-aarch64.flatpak linux-explode-*-linux-arm64.tar.gz
          test -s linux-explode-aarch64.flatpak
          test -s linux-explode-*-linux-arm64.tar.gz

      - name: Anexar ao release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber
          linux-explode-aarch64.flatpak linux-explode-*-linux-arm64.tar.gz

  checksums:
    name: SHA256SUMS sobre os assets publicados
    needs: [flatpak-x86_64, arm64]
    runs-on: ubuntu-latest
    steps:
      - name: Descarregar, somar e reenviar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir dist && cd dist
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern '*.flatpak' --pattern '*.tar.gz' --clobber
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber SHA256SUMS
          echo '--- assets no release ---'
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[] | "  \(.name)  \(.size) bytes  \(.state)"'
